name: Avisos de reposición
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restock
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprobar stock
        env:
          SELLAUTH_API_KEY: ${{ secrets.SELLAUTH_API_KEY }}
          SELLAUTH_SHOP_ID: '194636'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_SALES_WEBHOOK_URL: ${{ secrets.DISCORD_SALES_WEBHOOK_URL }}
        run: node check.mjs
      - name: Guardar estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json sales.json)" ]; then
            git config user.name "streamshop-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json sales.json 2>/dev/null || git add state.json
            git commit -m "estado de stock y ventas"
            git push
          fi
